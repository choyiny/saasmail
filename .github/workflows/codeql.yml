name: CodeQL

on:
  push:
    branches: [main]
  # Stacked PRs target their parent branch rather than main, so filtering on
  # `main` alone silently skips CodeQL for every PR in a stack until the base
  # of the stack lands. Match the branch-name prefixes this repo uses for
  # feature work so a stacked PR is scanned like any other.
  pull_request:
    branches: [main, "feat/**", "fix/**", "refactor/**", "chore/**"]
  schedule:
    - cron: "17 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
