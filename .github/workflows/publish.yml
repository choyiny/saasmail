name: Publish

# Publishes the npm package `saasmail` when a release is published. Never runs on pull requests.
# Two jobs: `build` installs dependencies, tests and packs with read-only permissions and no
# OIDC token; `publish` only downloads the packed directory and runs `npm publish`, so no
# dependency code ever runs where a publish token can be minted. Publishing uses npm trusted
# publishing (OIDC): no npm token is stored. The package's trusted publisher on npmjs.com is
# choyiny/saasmail, workflow publish.yml.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check the tag is vX.Y.Z[-pre]
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z[-pre]; not publishing."
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      # No dependency cache: a release build never restores what other runs wrote.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
      - name: Seed wrangler.jsonc (gitignored; needed by vitest-pool-workers)
        run: cp wrangler.jsonc.ci wrangler.jsonc
      - name: Create empty assets dir (referenced by wrangler.jsonc)
        run: mkdir -p dist/client
      - run: yarn test
      - name: Build the package
        run: node scripts/saasmail/pack.mjs --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: build/npm
          # client/.assetsignore must ship.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - name: Check the tag is vX.Y.Z[-pre]
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z[-pre]; not publishing."
            exit 1
          fi
      # No checkout and no install: only the packed directory from `build` is published.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: build/npm
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A prerelease goes to the `next` tag so `latest` stays on the last release.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish ./build/npm --provenance --access public --tag "$tag" --ignore-scripts
