name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Seed wrangler.jsonc (gitignored; needed by vite dev)
        run: |
          cp wrangler.jsonc.ci wrangler.jsonc
          # Workers AI is remote-only and this suite does not exercise the
          # native agent. Keep the binding in wrangler.jsonc.ci, but remove it
          # from this temporary local-dev copy so CI needs no Cloudflare token.
          sed -i '/"ai": { "binding": "AI" },/d' wrangler.jsonc
          if grep -q '"binding": "AI"' wrangler.jsonc; then
            echo "AI binding still present" >&2
            exit 1
          fi

      - name: Create empty assets dir (referenced by wrangler.jsonc)
        run: mkdir -p dist/client

      - name: Write .dev.vars for demo-mode dev server
        run: |
          cat > .dev.vars <<EOF
          DEMO_MODE=1
          DISABLE_PASSKEY_GATE=true
          BETTER_AUTH_SECRET=ci-only-secret-not-used-for-real-auth
          UNSUBSCRIBE_SECRET=ci-only-unsubscribe-secret-not-used-for-real-tokens
          EOF

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run E2E suite
        run: yarn test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
